[project]
name = "seedpalette"
version = "0.1.0"
description = "Grow a few seed colors into full, readable light and dark website themes, with a report of every color it had to fix."
authors = [
    { name = "Katy Yut" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["color", "theme", "palette", "accessibility", "wcag", "contrast", "css"]
dependencies = [
    "pydantic (>=2.9,<3.0)",
    "pyyaml (>=6.0,<7.0)",
    "jinja2 (>=3.1,<4.0)",
]

[project.urls]
Repository = "https://github.com/kyut0/seedpalette"

[project.scripts]
seedpalette = "seedpalette.cli:main"

[dependency-groups]
dev = [
    "pytest (>=8.3,<9.0)",
    "pytest-cov (>=6.0,<7.0)",
    "ruff (>=0.8,<1.0)",
    "mypy (>=1.13,<2.0)",
    "types-pyyaml (>=6.0,<7.0)",
    "pre-commit (>=4.0,<5.0)",
]

[tool.poetry]
packages = [{ include = "seedpalette", from = "src" }]
include = [{ path = "src/seedpalette/templates/*.html", format = ["sdist", "wheel"] }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["seedpalette"]
force-sort-within-sections = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
