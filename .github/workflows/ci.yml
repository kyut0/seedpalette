name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry==2.2.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: poetry run seedpalette check examples/themes.yaml
